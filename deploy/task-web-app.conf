# nginx server blocks for Dayflow, dropped into the shared nginx's conf.d (see deploy/README.md).
# The upstream is resolved at request time (variable + resolver) so a stopped Dayflow can never stop nginx
# from starting or reloading for the other sites on this host.

server {
    listen 80;
    server_name task-web-app.silverjeanscloth.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name task-web-app.silverjeanscloth.com;

    ssl_certificate /etc/nginx/ssl/task-web-app.fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/task-web-app.privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 12M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        set $dayflow_upstream http://dayflow-web:3000;
        proxy_pass $dayflow_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Required for the authenticated /api/sync/events stream.
        proxy_buffering off;
        proxy_read_timeout 75s;
    }
}
